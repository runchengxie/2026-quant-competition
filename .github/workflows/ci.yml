name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --locked --extra test --extra ibkr --extra daily-data
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check src/adapters/ibkr/events.py src/competition_tools/check_pages_content.py tests/test_source_layout.py tests/competition_tools/test_check_pages_content.py
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Compile Python packages
        run: uv run --locked python -m compileall -q src
      - name: Scan full Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  team-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install and exercise standalone team profile
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/team-bootstrap" --python 3.12
          uv pip install --python "$RUNNER_TEMP/team-bootstrap/bin/python" --no-deps -e .
          source "$RUNNER_TEMP/team-bootstrap/bin/activate"
          python -m competition_tools.team init --config "$RUNNER_TEMP/team.toml" --data-root "$RUNNER_TEMP/team-data" --environment-root "$RUNNER_TEMP/team-envs"
          python -m competition_tools.team setup --config "$RUNNER_TEMP/team.toml" --profile offline
          python -m competition_tools.team doctor --config "$RUNNER_TEMP/team.toml"
          "$RUNNER_TEMP/team-envs/root/bin/python" -m competition_tools.check_team_delivery --config "$RUNNER_TEMP/team.toml"
          "$RUNNER_TEMP/team-envs/root/bin/python" -m competition_tools.check_study_delivery --config "$RUNNER_TEMP/team.toml" --output-root "$RUNNER_TEMP/study-contract"
          "$RUNNER_TEMP/team-envs/root/bin/python" -m competition_tools.check_ablation_delivery --config "$RUNNER_TEMP/team.toml" --output-root "$RUNNER_TEMP/ablation-contract"
          cd "$RUNNER_TEMP"
          export HOME="$RUNNER_TEMP/empty-home"
          "$RUNNER_TEMP/team-envs/root/bin/python" -m competition_tools.team demo equity --config "$RUNNER_TEMP/team.toml" --output-root "$RUNNER_TEMP/equity-demo"
          "$RUNNER_TEMP/team-envs/root/bin/python" -m competition_tools.team demo crypto --config "$RUNNER_TEMP/team.toml" --output-root "$RUNNER_TEMP/crypto-demo"
