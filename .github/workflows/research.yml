name: Offline research

on:
  pull_request:
    paths: ["src/competition_tools/evaluation/**", "src/competition_tools/*ablation*", "src/competition_tools/team/evaluate.py", "src/competition_tools/team/factors.py", "src/competition_tools/check_dex_factor_delivery.py", "src/competition_tools/datasets/dex*.py", "tests/competition_tools/test_dex*.py", "tests/competition_tools/test_factor_delivery.py", "tests/competition_tools/*ablation*", "research/**", "src/competition_tools/*acceptance.py", "src/competition_tools/check_research_receipts.py", "src/competition_tools/*accounting*", "src/strategies/hk_low_frequency/backtest.py", "tests/competition_tools/*accounting*", "schemas/research/**", "tests/competition_tools/*research*", "tests/competition_tools/test_experiment_acceptance.py", ".github/workflows/research.yml", "pyproject.toml", "uv.lock"]
  push:
    branches: [main]
    paths: ["src/competition_tools/evaluation/**", "src/competition_tools/*ablation*", "src/competition_tools/team/evaluate.py", "src/competition_tools/team/factors.py", "src/competition_tools/check_dex_factor_delivery.py", "src/competition_tools/datasets/dex*.py", "tests/competition_tools/test_dex*.py", "tests/competition_tools/test_factor_delivery.py", "tests/competition_tools/*ablation*", "research/**", "src/competition_tools/*acceptance.py", "src/competition_tools/check_research_receipts.py", "src/competition_tools/*accounting*", "src/strategies/hk_low_frequency/backtest.py", "tests/competition_tools/*accounting*", "schemas/research/**", "tests/competition_tools/*research*", "tests/competition_tools/test_experiment_acceptance.py", ".github/workflows/research.yml", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [crypto-mm, equity-lab]
    defaults:
      run:
        working-directory: research/${{ matrix.project }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Configure external research paths
        shell: bash
        run: |
          echo "DATA_ROOT=$RUNNER_TEMP/research-data" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/research-envs/${{ matrix.project }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - name: Synthetic demo and smoke backtest
        shell: bash
        run: |
          if [ "${{ matrix.project }}" = crypto-mm ]; then
            uv run --locked python -m crypto_mm.demo
            uv run --locked python -m crypto_mm.commands.audit_data --json
            uv run --locked python -m crypto_mm.commands.backtest_cli --strategy B0 --days 2026-03-19
          else
            uv run --locked python -m equity_lab.cli demo
            uv run --locked python -m equity_lab.cli backtest --strategy equal_weight
          fi
      - name: Install separate root contract environment
        shell: bash
        run: UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/receipt-root-env" uv sync --project ../.. --locked --extra test
      - name: Exercise actual producer and root consumer
        shell: bash
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/receipt-root-env" uv run --project ../.. --locked python -m competition_tools.check_research_receipts --project "${{ matrix.project }}" --leaf-python "$RUNNER_TEMP/research-envs/${{ matrix.project }}/bin/python" --output-root "$RUNNER_TEMP/receipt-contract-${{ matrix.project }}"
      - name: Exercise synthetic hourly factor producer and root consumer
        if: matrix.project == 'crypto-mm'
        shell: bash
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/receipt-root-env" uv run --project ../.. --locked python -m competition_tools.check_dex_factor_delivery --leaf-python "$RUNNER_TEMP/research-envs/crypto-mm/bin/python" --output-root "$RUNNER_TEMP/dex-factor-contract"
      - run: uv build --out-dir "${{ runner.temp }}/wheels-${{ matrix.project }}"

  predictive:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: research/equity-lab
    steps:
      - uses: actions/checkout@v4
      - name: Configure external prediction paths
        shell: bash
        run: |
          echo "DATA_ROOT=$RUNNER_TEMP/predictive-data" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/predictive-env" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev --extra predictive
      - run: uv run --locked --extra predictive pytest tests/test_predictive_*.py -q
