[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-competition-execution"
version = "0.1.0"
description = "Auditable execution boundary for the Hong Kong quant competition"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
nautilus = ["nautilus_trader>=1.0"]
test = ["pytest>=8.0", "ruff>=0.11"]
ibkr = ["ib-insync>=0.9.86", "tzdata>=2024.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adapters*", "apps*", "packages*", "strategies*", "competition_tools*"]
