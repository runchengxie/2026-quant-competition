[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-competition-execution"
version = "0.1.0"
description = "Auditable execution boundary for the Hong Kong quant competition"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
nautilus = ["nautilus_trader>=1.0"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["adapters*", "apps*", "packages*", "strategies*"]
