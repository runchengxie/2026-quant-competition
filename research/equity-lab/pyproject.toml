[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-equity-lab"
version = "0.1.0"
description = "Offline daily equity research experiments"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "PyYAML>=6,<7", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
predictive = [
    "exchange-calendars==4.13.2",
    "pyarrow==23.0.1",
    "scikit-learn==1.7.2",
    "threadpoolctl==3.6.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["equity_lab*"]

[tool.setuptools.package-data]
equity_lab = ["config/**/*.yaml", "config/**/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
