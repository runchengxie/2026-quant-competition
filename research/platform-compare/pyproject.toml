[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-platform-compare"
version = "0.2.0"
description = "Standalone diagnostic accounting comparison"
requires-python = ">=3.12,<3.13"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "src/platform_compare/accounting/LICENSE-APACHE-2.0.txt", "src/platform_compare/accounting/NOTICE.txt"]
dependencies = ["numpy>=1.23", "pandas>=2.0", "pyarrow>=25.0.1", "PyYAML>=6.0", "exchange-calendars==4.13.2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["platform_compare*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"platform_compare.accounting" = ["LICENSE-APACHE-2.0.txt", "NOTICE.txt", "ORIGIN.json"]
