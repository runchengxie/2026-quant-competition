[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-crypto-mm"
version = "0.1.0"
description = "Offline event-driven market-making research on synthetic or user-provided data"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["matplotlib>=3.10,<4", "polars>=1.24,<1.43"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["crypto_mm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
